name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-release:
    runs-on: macos-14
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the provenance attestation
      attestations: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      TARGET: aarch64-apple-darwin
      ASSET: enclos-aarch64-apple-darwin.tar.gz
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Check the release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c '
          import json, sys
          metadata = json.load(sys.stdin)
          root = metadata["resolve"]["root"] if metadata["resolve"] else metadata["workspace_members"][0]
          print(next(package["version"] for package in metadata["packages"] if package["id"] == root))
          ')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag must match Cargo.toml: expected v$version, got $RELEASE_TAG" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build the release binary
        run: cargo build --locked --release --target "$TARGET"

      - name: Package and verify the release assets
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          binary="target/$TARGET/release/enclos"
          test "$(lipo -archs "$binary")" = arm64
          test "$("$binary" --version)" = "enclos $RELEASE_VERSION"
          mkdir -p dist/package dist/check
          install -m 755 "$binary" dist/package/enclos
          COPYFILE_DISABLE=1 tar -czf "dist/$ASSET" -C dist/package enclos
          (
            cd dist
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
            shasum -a 256 -c "$ASSET.sha256"
          )
          test "$(tar -tzf "dist/$ASSET")" = enclos
          tar -xzf "dist/$ASSET" -C dist/check
          test -x dist/check/enclos
          test "$(dist/check/enclos --version)" = "enclos $RELEASE_VERSION"

      - name: Attest where the archive was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.ASSET }}

      - name: Upload, verify, then publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=false
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease=true
          fi
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"; then
            if [[ "$draft" != true ]]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace its assets." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --generate-notes --prerelease="$prerelease"
          fi
          gh release upload "$RELEASE_TAG" "dist/$ASSET" "dist/$ASSET.sha256" --clobber
          mkdir -p dist/download
          gh release download "$RELEASE_TAG" --dir dist/download \
            --pattern "$ASSET" --pattern "$ASSET.sha256"
          (
            cd dist/download
            shasum -a 256 -c "$ASSET.sha256"
          )
          cmp "dist/$ASSET" "dist/download/$ASSET"
          cmp "dist/$ASSET.sha256" "dist/download/$ASSET.sha256"
          if [[ "$prerelease" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
