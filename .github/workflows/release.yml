name: release

on:
  push:
    tags: ["v*"]
  # A dry run: builds, packs and tries every archive, and publishes nothing.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package-release.sh
      - rust-toolchain.toml
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Every archive of a release, each with its `.sha256` beside it.
  ASSETS: >-
    enclos-aarch64-apple-darwin.tar.gz
    enclos-x86_64-unknown-linux-musl.tar.gz
    enclos-aarch64-unknown-linux-musl.tar.gz

jobs:
  # Builds with read access only: `cargo build` runs every dependency's build
  # script, so it never sees a token that can publish or sign.
  build:
    strategy:
      matrix:
        include:
          # A current arm64 image; the deployment target keeps the binary
          # running on macOS 15 and later, the oldest version CI tests.
          - target: aarch64-apple-darwin
            runner: macos-26
          # Static against musl, so the binary needs nothing of the host's
          # libc (docs/releases.md). Each built on its own architecture.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      TARGET: ${{ matrix.target }}
      # The bundled SQLite, the one C dependency, built against musl too.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # musl-gcc for the C dependencies; bubblewrap for `enclos doctor` below.
      - name: Install musl's C compiler and bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools bubblewrap

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      # Only a tag publishes, so only a tag is held to the version; a dry
      # run builds whatever version Cargo.toml has.
      - name: Check the release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c '
          import json, sys
          metadata = json.load(sys.stdin)
          root = metadata["resolve"]["root"] if metadata["resolve"] else metadata["workspace_members"][0]
          print(next(package["version"] for package in metadata["packages"] if package["id"] == root))
          ')"
          if [[ "$EVENT" == push && "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag must match Cargo.toml: expected v$version, got $RELEASE_TAG" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build the release binary
        run: cargo build --locked --release --target "$TARGET"

      - name: Package and verify the release assets
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          binary="target/$TARGET/release/enclos"
          case "$TARGET" in
            *-apple-darwin)
              test "$(lipo -archs "$binary")" = arm64
              ;;
            *-linux-musl)
              # Static: no program interpreter and no shared library, so it
              # loads nothing of the host's libc.
              file "$binary"
              readelf --program-headers "$binary" > headers.txt
              readelf --dynamic "$binary" > dynamic.txt
              if grep -q INTERP headers.txt || grep -q NEEDED dynamic.txt; then
                echo "$binary is not static" >&2
                exit 1
              fi
              machine="$(readelf --file-header "$binary" | sed -n 's/^ *Machine: *//p')"
              case "$TARGET" in
                x86_64-*) test "$machine" = "Advanced Micro Devices X86-64" ;;
                aarch64-*) test "$machine" = AArch64 ;;
              esac
              ;;
          esac
          test "$("$binary" --version)" = "enclos $RELEASE_VERSION"
          scripts/package-release.sh "$binary" "$TARGET" dist
          mkdir -p check
          tar -xzf "dist/enclos-$TARGET.tar.gz" -C check
          test "$(check/enclos --version)" = "enclos $RELEASE_VERSION"

      # The (allow default) comparison baseline is a debug build's only
      # (ADR 0006): every test runs one, so only a release shows it refused.
      - name: Check a release refuses the comparison baseline
        if: runner.os == 'macOS'
        run: |
          binary="target/$TARGET/release/enclos"
          ENCLOS_HOME="$(mktemp -d)" ENCLOS_SEATBELT_BASELINE=allow-default \
            "$binary" --json init > init.json
          python3 -c '
          import json
          init = json.load(open("init.json"))
          assert init["default_backend"] is None, init
          reasons = [u["reason"] for u in init["unavailable"] if u["backend"] == "seatbelt"]
          assert reasons and "never a release" in reasons[0], init
          '

      # As ci.yml's bubblewrap job: none where bubblewrap runs as installed,
      # else the profile docs/getting-started.md gives (Ubuntu 24.04).
      - name: The AppArmor setting bubblewrap needs here
        if: runner.os == 'Linux'
        run: |
          try() { bwrap --ro-bind / / true; }
          if try; then
            echo "setting: none (bubblewrap runs as installed)"
          else
            sudo tee /etc/apparmor.d/enclos-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile enclos-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/enclos-bwrap
            try
            echo "setting: the AppArmor profile for /usr/bin/bwrap"
          fi

      # On Linux only bubblewrap can run, so doctor's exit 0 says it does,
      # with systemd 254 or later.
      - name: The packed binary's doctor finds bubblewrap running here
        if: runner.os == 'Linux'
        run: ENCLOS_HOME="$(mktemp -d)" check/enclos doctor

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # The Linux archives on the supported hosts that did not build them:
  # Ubuntu 26.04, and Debian 13 in a container on each architecture
  # (Raspberry Pi OS is Debian 13 on arm64).
  try:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            image: debian:13
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            image: debian:13
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      IMAGE: ${{ matrix.image }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist

      - name: Check and unpack the archive
        run: |
          (cd dist && sha256sum -c "enclos-$TARGET.tar.gz.sha256")
          mkdir -p check
          tar -xzf "dist/enclos-$TARGET.tar.gz" -C check

      - name: Install bubblewrap
        if: matrix.image == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      # Ubuntu 26.04 needs no setting: its AppArmor has a rule for bubblewrap.
      - name: The packed binary runs here, and its doctor finds bubblewrap running
        if: matrix.image == ''
        run: |
          uname -a
          bwrap --version
          systemd-run --version | head -1
          test "$(check/enclos --version)" = "enclos $RELEASE_VERSION"
          ENCLOS_HOME="$(mktemp -d)" check/enclos doctor

      # A container shares the runner's kernel: what it shows is the
      # distribution's userland, the part a static binary does not use.
      # Privileged, so bubblewrap can make namespaces in it.
      - name: The packed binary runs in Debian 13, and its doctor finds bubblewrap running
        if: matrix.image != ''
        run: |
          docker run --rm --privileged -v "$PWD/check:/release:ro" \
            -e RELEASE_VERSION "$IMAGE" sh -ec '
              grep PRETTY_NAME /etc/os-release
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends bubblewrap systemd >/dev/null
              bwrap --version
              systemd-run --version | head -1
              test "$(/release/enclos --version)" = "enclos $RELEASE_VERSION"
              ENCLOS_HOME="$(mktemp -d)" /release/enclos doctor
            '

  # Signs and publishes what `build` made, without building anything; only
  # for a tag.
  publish:
    needs: [build, try]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the provenance attestation
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Check the downloaded assets
        run: |
          cd dist
          expected="$(for asset in $ASSETS; do printf '%s\n' "$asset" "$asset.sha256"; done | sort)"
          found="$(ls | sort)"
          if [[ "$found" != "$expected" ]]; then
            printf 'Expected these assets:\n%s\nGot:\n%s\n' "$expected" "$found" >&2
            exit 1
          fi
          for asset in $ASSETS; do
            shasum -a 256 -c "$asset.sha256"
          done

      - name: Attest where each archive was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Upload, verify, then publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          prerelease=false
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease=true
          fi
          # Create the release only when GitHub says there is none; any other
          # failure to look it up stops here.
          if state="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>&1)"; then
            if [[ "$state" != true ]]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace its assets." >&2
              exit 1
            fi
          elif [[ "$state" == *"release not found"* ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --generate-notes --prerelease="$prerelease"
          else
            echo "Could not look up release $RELEASE_TAG: $state" >&2
            exit 1
          fi
          files=()
          patterns=()
          for asset in $ASSETS; do
            files+=("dist/$asset" "dist/$asset.sha256")
            patterns+=(--pattern "$asset" --pattern "$asset.sha256")
          done
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          mkdir -p download
          gh release download "$RELEASE_TAG" --dir download "${patterns[@]}"
          for asset in $ASSETS; do
            (
              cd download
              shasum -a 256 -c "$asset.sha256"
            )
            cmp "dist/$asset" "download/$asset"
            cmp "dist/$asset.sha256" "download/$asset.sha256"
          done
          if [[ "$prerelease" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
