name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Both OSes, so platform-specific code (Seatbelt, bubblewrap) is linted
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain and components pinned in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS 26 too: Seatbelt rules such as hid-control behave differently
        # there (design §5).
        os: [macos-15, macos-26, ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      # The escape probes that would act on the host if a rule did not hold
      # (LaunchServices, Apple Events, launchd, preferences) run only on
      # these throwaway runners, never on a developer's Mac.
      ENCLOS_HOST_SERVICE_PROBES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Here, since the prototype's workflows skip a change to docs/adr/ alone
      - name: ADRs 0037 to 0040 stay proposed
        run: python3 -I prototype/m3/test_adr_status.py
      - name: Installer tests (no downloads, nothing installed)
        if: runner.os == 'macOS'
        run: python3 tests/test_install.py
      # Installs the toolchain and components pinned in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked --all-features
      # A release build refuses the comparison baseline (ADR 0006): checked
      # on every change, not only when a tag is pushed.
      - name: A release refuses the comparison baseline
        if: runner.os == 'macOS'
        run: cargo test --release --locked --test cli init_takes_allow_default_only_in_a_debug_build

  systemd-units:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      # The tests that install real units run only on these throwaway
      # runners, never on a developer's host (src/service/systemd.rs).
      ENCLOS_SYSTEMD_UNIT_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain and components pinned in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A runner has no login session, so no user manager without this. It
      # says nothing of what enclos does about lingering (design §15).
      - name: A user manager for the runner
        run: |
          sudo loginctl enable-linger "$(id -un)"
          runtime_dir="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >>"$GITHUB_ENV"
          timeout 30 sh -c 'until [ -S "$1/bus" ]; do sleep 1; done' sh "$runtime_dir"
      # A test renamed away would leave the filter matching nothing, and
      # cargo test passing all the same, so the count is checked too.
      - name: Real units, all of them
        shell: bash
        run: |
          cargo test --locked --all-features --lib service::systemd::tests::on_a_runner | tee units.log
          grep -q 'test result: ok\. 10 passed' units.log

  libsecret:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      # The tests that write to a Secret Service run only here, on a private
      # bus with a throwaway keyring, never on a developer's host
      # (src/secrets/libsecret.rs).
      ENCLOS_LIBSECRET_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y dbus gnome-keyring libsecret-tools
      # Installs the toolchain and components pinned in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked --all-features --lib --no-run
      # Each test on a bus and a keyring of its own: one locks its keyring,
      # which nothing here can unlock without asking.
      # Both run, whichever fails.
      - name: On a private bus, with a throwaway keyring
        run: |
          failed=0
          for test in a_secret_is_stored_read_replaced_and_removed a_locked_collection_is_told_without_asking; do
            XDG_DATA_HOME="$(mktemp -d)" dbus-run-session -- sh -ec '
              printf throwaway | gnome-keyring-daemon --unlock --components=secrets
              cargo test --locked --all-features --lib "secrets::libsecret::tests::on_a_runner_$1"
            ' sh "$test" || failed=1
          done
          exit "$failed"
      # The real tool on a bus with no Secret Service, which nothing else
      # runs: this cue alone sends a host's tokens to the plain file. A test
      # renamed away would leave the filter matching nothing, and cargo test
      # passing all the same, so the count is checked too.
      - name: On a bus with no Secret Service
        shell: bash
        run: |
          dbus-run-session --config-file=.github/dbus-no-activation.conf -- \
            cargo test --locked --all-features --lib \
            secrets::libsecret::tests::on_a_runner_a_bus_with_no_secret_service_uses_the_file | tee no-service.log
          grep -q 'test result: ok\. 1 passed' no-service.log

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The action leaves its gitleaks on the PATH
      - name: Check what the home-folder-path rule catches
        run: sh tests/gitleaks_rule.sh

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  ci-ok:
    if: always()
    needs: [lint, test, systemd-units, libsecret, secrets, deny]
    runs-on: ubuntu-24.04
    steps:
      - name: Check needed jobs
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All required jobs passed"
