name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Both OSes, so platform-specific code (Seatbelt, bubblewrap) is linted
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain and components pinned in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS 26 too: Seatbelt rules such as hid-control behave differently
        # there (design §5).
        os: [macos-15, macos-26, ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      # The escape probes that would act on the host if a rule did not hold
      # (LaunchServices, Apple Events, launchd, preferences) run only on
      # these throwaway runners, never on a developer's Mac.
      ENCLOS_HOST_SERVICE_PROBES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Here, since the prototype's workflows skip a change to docs/adr/ alone
      - name: ADRs 0037 to 0041 stay accepted
        run: python3 -I prototype/m3/test_adr_status.py
      # On every system: each test plays a Mac or a Linux host through stubs,
      # and runs on the host's own bash, tar and checksum tools.
      - name: Installer tests (no downloads, nothing installed)
        run: python3 -I tests/test_install.py
      # Installs the toolchain and components pinned in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked --workspace --all-features
      # A release build refuses the comparison baseline (ADR 0006): checked
      # on every change, not only when a tag is pushed.
      - name: A release refuses the comparison baseline
        if: runner.os == 'macOS'
        run: cargo test --release --locked --test cli init_takes_allow_default_only_in_a_debug_build

  systemd-units:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      # The tests that install real units run only on these throwaway
      # runners, never on a developer's host (src/service/systemd.rs).
      ENCLOS_SYSTEMD_UNIT_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain and components pinned in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A runner has no login session, so no user manager without this. It
      # says nothing of what enclos does about lingering (design §15).
      - name: A user manager for the runner
        run: |
          sudo loginctl enable-linger "$(id -un)"
          runtime_dir="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >>"$GITHUB_ENV"
          timeout 30 sh -c 'until [ -S "$1/bus" ]; do sleep 1; done' sh "$runtime_dir"
      # A test renamed away would leave the filter matching nothing, and
      # cargo test passing all the same, so the count is checked too.
      - name: Real units, all of them
        shell: bash
        run: |
          cargo test --locked --all-features --lib service::systemd::tests::on_a_runner | tee units.log
          grep -q 'test result: ok\. 11 passed' units.log

  cgroups:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      # The tests that start scopes in the user's manager and end what runs
      # in them run only on these throwaway runners, never on a developer's
      # host (src/engine/tests/runtime/cgroups.rs).
      ENCLOS_CGROUP_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain and components pinned in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A runner has no login session, so no user manager without this. It
      # says nothing of what enclos does about lingering (design §15).
      - name: A user manager for the runner
        run: |
          sudo loginctl enable-linger "$(id -un)"
          runtime_dir="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >>"$GITHUB_ENV"
          timeout 30 sh -c 'until [ -S "$1/bus" ]; do sleep 1; done' sh "$runtime_dir"
      - name: The kernel and systemd under test
        run: |
          uname -r
          systemd-run --version
      - name: Scopes in the runner's user manager
        run: |
          cargo test --locked --all-features --lib engine::tests::runtime::cgroups::on_a_runner | tee cgroups.log
          grep -q 'test result: ok\. 13 passed' cgroups.log

  confinement:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      # The tests that apply Landlock and seccomp and try what they refuse
      # run only on these throwaway runners, never on a developer's host
      # (tests/inside.rs).
      ENCLOS_CONFINEMENT_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain and components pinned in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Asks the kernel's Landlock ABI, -1 without Landlock; restricts nothing.
      # legacy_tiocsti says what the TIOCSTI test's control can show.
      - run: |
          uname -r
          python3 -c "import ctypes; print('Landlock ABI', ctypes.CDLL(None).syscall(444, None, 0, 1))"
          if [ -e /proc/sys/dev/tty/legacy_tiocsti ]; then echo "legacy_tiocsti $(cat /proc/sys/dev/tty/legacy_tiocsti)"; fi
      - run: cargo test --locked --all-features --test inside on_a_runner
      # A /proc that refuses other users' processes: mounted with hidepid=1
      # as root in a mount namespace of its own, a new instance that leaves
      # the runner's /proc as it is, then read as the runner's user. A test
      # renamed away would leave the filter matching nothing, so the count is
      # checked too; the runner's own /proc still reads pid 1 after.
      - name: Scans of a /proc mounted with hidepid=1
        shell: bash
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            ENCLOS_HIDEPID_TESTS=1 \
            unshare --mount --propagation private -- sh -ec '
              mount -t proc -o hidepid=1 proc /proc
              exec setpriv --reuid="$1" --regid="$2" --init-groups -- \
                cargo test --locked --all-features --lib lifecycle::proc::tests::on_a_runner
            ' sh "$(id -un)" "$(id -gn)" | tee hidepid.log
          grep -q 'test result: ok\. 1 passed' hidepid.log
          head -1 /proc/1/status

  bubblewrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      # The tests that create bubblewrap sandboxes and run sessions in them
      # run only on these throwaway runners, never on a developer's host
      # (tests/bubblewrap.rs).
      ENCLOS_BUBBLEWRAP_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Installs the toolchain and components pinned in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A runner has no login session, so no user manager without this. It
      # says nothing of what enclos does about lingering (design §15).
      - name: A user manager for the runner
        run: |
          sudo loginctl enable-linger "$(id -un)"
          runtime_dir="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >>"$GITHUB_ENV"
          timeout 30 sh -c 'until [ -S "$1/bus" ]; do sleep 1; done' sh "$runtime_dir"
      # The least setting the host survey found (design §5, Linux hosts): none where
      # bubblewrap runs as installed, as on 26.04, whose own rule the
      # profile would break; else the profile docs/getting-started.md gives,
      # which Ubuntu 24.04's restriction on user namespaces needs.
      - name: The AppArmor setting bubblewrap needs here
        run: |
          try() { bwrap --ro-bind / / true; }
          if try; then
            echo "setting: none (bubblewrap runs as installed)"
          else
            sudo tee /etc/apparmor.d/enclos-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile enclos-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/enclos-bwrap
            try
            echo "setting: the AppArmor profile for /usr/bin/bwrap"
          fi
      - name: The host under test
        run: |
          uname -r
          bwrap --version
          systemd-run --version | head -1
          python3 -c "import ctypes; print('Landlock ABI', ctypes.CDLL(None).syscall(444, None, 0, 1))"
          echo "apparmor_restrict_unprivileged_userns: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
      # A test renamed away would leave the filter matching nothing, and
      # cargo test passing all the same, so the count is checked too. One of
      # them runs `policy test` and fails if any probe reads open.
      - name: Sandboxes and sessions under bubblewrap
        shell: bash
        run: |
          cargo test --locked --all-features --test bubblewrap on_a_runner -- --test-threads=1 | tee bubblewrap.log
          grep -q 'test result: ok\. 23 passed' bubblewrap.log
      - name: The escape probes' report
        if: always()
        run: |
          cat target/tmp/policy-test-lab.txt || echo "no report: policy test did not run"
      # Adds a second user to the runner, whose connections it must close.
      - name: enclos dashboard, a second user and Ctrl-C
        shell: bash
        run: |
          cargo test --locked --all-features --test dashboard on_a_runner | tee dashboard.log
          grep -q 'test result: ok\. 1 passed' dashboard.log

  libsecret:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      # The tests that write to a Secret Service run only here, on a private
      # bus with a throwaway keyring, never on a developer's host
      # (src/secrets/libsecret.rs).
      ENCLOS_LIBSECRET_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y dbus gnome-keyring libsecret-tools
      # Installs the toolchain and components pinned in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked --all-features --lib --no-run
      # Each test on a bus and a keyring of its own: one locks its keyring,
      # which nothing here can unlock without asking.
      # Both run, whichever fails.
      - name: On a private bus, with a throwaway keyring
        run: |
          failed=0
          for test in a_secret_is_stored_read_replaced_and_removed a_locked_collection_is_told_without_asking; do
            XDG_DATA_HOME="$(mktemp -d)" dbus-run-session -- sh -ec '
              printf throwaway | gnome-keyring-daemon --unlock --components=secrets
              cargo test --locked --all-features --lib "secrets::libsecret::tests::on_a_runner_$1"
            ' sh "$test" || failed=1
          done
          exit "$failed"
      # The real tool on a bus with no Secret Service, which nothing else
      # runs: this cue alone sends a host's tokens to the plain file. A test
      # renamed away would leave the filter matching nothing, and cargo test
      # passing all the same, so the count is checked too.
      - name: On a bus with no Secret Service
        shell: bash
        run: |
          dbus-run-session --config-file=.github/dbus-no-activation.conf -- \
            cargo test --locked --all-features --lib \
            secrets::libsecret::tests::on_a_runner_a_bus_with_no_secret_service_uses_the_file | tee no-service.log
          grep -q 'test result: ok\. 1 passed' no-service.log

  # The Linux releases are static builds against musl (docs/releases.md),
  # built natively on these runners as release.yml builds them: the whole
  # suite, and the runner-only tests that reach the kernel and systemd
  # through libc, run against that build too.
  musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      # The bundled SQLite, the one C dependency, built against musl too.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y musl-tools bubblewrap
      # Installs the toolchain and components pinned in rust-toolchain.toml
      - run: rustup toolchain install
      - run: rustup target add "$CARGO_BUILD_TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked --all-features
      # A runner has no login session, so no user manager without this. It
      # says nothing of what enclos does about lingering (design §15).
      - name: A user manager for the runner
        run: |
          sudo loginctl enable-linger "$(id -un)"
          runtime_dir="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >>"$GITHUB_ENV"
          timeout 30 sh -c 'until [ -S "$1/bus" ]; do sleep 1; done' sh "$runtime_dir"
      # As in the bubblewrap job above.
      - name: The AppArmor setting bubblewrap needs here
        run: |
          try() { bwrap --ro-bind / / true; }
          if try; then
            echo "setting: none (bubblewrap runs as installed)"
          else
            sudo tee /etc/apparmor.d/enclos-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile enclos-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/enclos-bwrap
            try
            echo "setting: the AppArmor profile for /usr/bin/bwrap"
          fi
      # On Linux only bubblewrap can run, so doctor's exit 0 says it does,
      # with systemd 254 or later.
      - name: The musl binary runs, and its doctor finds bubblewrap running
        shell: bash
        run: |
          binary="target/$CARGO_BUILD_TARGET/debug/enclos"
          file "$binary"
          "$binary" --version
          said="$(ENCLOS_HOME="$(mktemp -d)" "$binary" --text doctor)"
          printf '%s\n' "$said"
          grep -q 'bubblewrap: runs here' <<<"$said"
      # The jobs above count each group's tests; here a filter that matches
      # nothing still fails.
      - name: Landlock and seccomp
        shell: bash
        env:
          ENCLOS_CONFINEMENT_TESTS: "1"
        run: |
          cargo test --locked --all-features --test inside on_a_runner | tee inside.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' inside.log
      - name: Sandboxes and sessions under bubblewrap
        shell: bash
        env:
          ENCLOS_BUBBLEWRAP_TESTS: "1"
        run: |
          cargo test --locked --all-features --test bubblewrap on_a_runner -- --test-threads=1 | tee bubblewrap.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' bubblewrap.log
      - name: enclos dashboard, a second user and Ctrl-C
        shell: bash
        env:
          ENCLOS_BUBBLEWRAP_TESTS: "1"
        run: |
          cargo test --locked --all-features --test dashboard on_a_runner | tee dashboard.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' dashboard.log
      - name: Scopes in the runner's user manager
        shell: bash
        env:
          ENCLOS_CGROUP_TESTS: "1"
        run: |
          cargo test --locked --all-features --lib engine::tests::runtime::cgroups::on_a_runner | tee cgroups.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' cgroups.log
      - name: Real units
        shell: bash
        env:
          ENCLOS_SYSTEMD_UNIT_TESTS: "1"
        run: |
          cargo test --locked --all-features --lib service::systemd::tests::on_a_runner | tee units.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' units.log

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The action leaves its gitleaks on the PATH
      - name: Check what the home-folder-path rule catches
        run: sh tests/gitleaks_rule.sh

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # enclos-protocol also builds into the Android app (victorbonnet/enclos-app):
  # catch a dependency that does not build for Android here, first
  protocol-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked -p enclos-protocol --target aarch64-linux-android

  # The Hermes channel plugin's protocol and outbox, against the crate's
  # fixtures; standard library only, no Hermes needed. The checks of the
  # bridge's signed decisions need `cryptography`, which Hermes ships: they
  # skip here and run in hermes-latest.
  hermes-plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -I -m unittest discover -s channels/hermes/tests -v

  # The same tests against the latest Hermes, its default branch, never
  # pinned: every test that needs a real Hermes runs (`ENCLOS_HERMES_SOURCE`),
  # and one that skips for want of it fails the job, so a Hermes change the
  # plugin relies on shows here rather than in a gateway. It is in `ci-ok`
  # on purpose: an upstream change that breaks the plugin blocks every PR
  # until enclos is changed to fit it, since enclos follows the latest
  # Hermes rather than pinning one. It runs Hermes's code, so neither
  # checkout keeps the token.
  hermes-latest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
          persist-credentials: false
      - run: git -C hermes-agent log -1 --format='Hermes %H, %cI'
      # Hermes installs with uv, as Hermes itself does: from its own lock and
      # the overrides in its `[tool.uv]` (pip cannot resolve its pins without
      # them), with the Python its `.python-version` names.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --no-dev --project hermes-agent
      - name: Run every test, the real-Hermes ones included
        env:
          ENCLOS_HERMES_SOURCE: ${{ github.workspace }}/hermes-agent
        run: |
          hermes-agent/.venv/bin/python -I -m unittest discover -s channels/hermes/tests -v 2>&1 | tee unittest.log
          if grep -n "skipped 'optional \(real Hermes\|cryptography\)" unittest.log; then
            echo "::error::a real-Hermes or signed-decision test skipped although Hermes is installed"
            exit 1
          fi

  openclaw-launchers:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test src/runtime/openclaw/*.test.mjs

  # The exact native SDK is the channel's tested contract. Install it only in
  # a disposable prefix; no package lifecycle scripts or onboarding run.
  openclaw-channel:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check generated channel JavaScript
        run: node channels/openclaw/scripts/build.mjs --check
      - name: Install the supported public SDK without running package scripts
        shell: bash
        run: |
          sdk_prefix="$RUNNER_TEMP/enclos-openclaw-sdk"
          npm install --prefix "$sdk_prefix" --cache "$RUNNER_TEMP/enclos-openclaw-npm-cache" \
            --registry=https://registry.npmjs.org --ignore-scripts --omit=dev \
            --no-audit --no-fund --package-lock=false openclaw@2026.11.2
          echo "ENCLOS_OPENCLAW_PACKAGE=$sdk_prefix/node_modules/openclaw" >>"$GITHUB_ENV"
      - name: Channel tests including installed SDK probes
        run: node --test channels/openclaw/tests/*.test.js

  ci-ok:
    if: always()
    needs: [lint, test, systemd-units, cgroups, confinement, bubblewrap, libsecret, musl, secrets, deny, protocol-android, hermes-plugin, hermes-latest, openclaw-launchers, openclaw-channel]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Check needed jobs
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
      # `needs` sums each matrix as one result, and once read as passing
      # while a leg had failed (run 41849592145): every job is checked too.
      - name: Check every job of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bad=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.name != "ci-ok" and .conclusion != "success") | "\(.name): \(.conclusion // .status)"')
          if [ -n "$bad" ]; then
            echo "$bad"
            exit 1
          fi
          echo "All jobs of this run passed"
