name: bwrap-prototype

# Milestone 3's bubblewrap prototype (prototype/m3/, design §14, M3-02) on
# GitHub's Ubuntu runners: the sandbox's mounts, Landlock and seccomp, the
# host's Unix sockets, the relay, Hermes's installer and Chromium. Every
# check acts on the host, so they run only on these throwaway runners. Each
# writes its result to m3-results/, uploaded as the job's artifact and shown
# in its summary. It reports; it does not gate merges.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "prototype/m3/**"
      - ".github/workflows/bwrap-prototype.yml"

permissions:
  contents: read

jobs:
  prototype:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RESULTS_DIR: ${{ github.workspace }}/m3-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The compile step's tests (no host access)
        run: python3 -I prototype/m3/test_compile.py
      - name: Set up the runner (packages, AppArmor setting for bubblewrap)
        run: bash prototype/m3/setup-runner.sh
      - name: Landlock proc O_TRUNC regression
        run: python3 -I prototype/m3/test_oom.py
      - name: Files, programs and system calls
        if: always()
        run: bash prototype/m3/sandbox-check.sh
      - name: The host's Unix sockets
        if: always()
        run: bash prototype/m3/sockets-check.sh
      - name: The relay
        if: always()
        run: bash prototype/m3/relay-check.sh
      - name: Hermes's installer
        if: always()
        run: bash prototype/m3/hermes-check.sh
      - name: Chromium
        if: always()
        run: bash prototype/m3/chromium-check.sh
      - name: bubblewrap's options by distribution
        if: always()
        run: bash prototype/m3/options-check.sh
      - name: Summary
        if: always()
        run: |
          {
            echo "# ${{ matrix.os }}"
            cat m3-results/*.md
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m3-results-${{ matrix.os }}
          path: m3-results/
