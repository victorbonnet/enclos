name: update-prices

# Weekly: rewrites the generated part of enclos's price list (src/prices.toml,
# issue #343, ADR 0075) from LiteLLM's latest commit, and opens or updates a
# pull request when a rate changed. A person reviews every price change before
# it ships; enclos fetches no price when it runs.
#
# Uses the built-in GITHUB_TOKEN only. The repository must let GitHub Actions
# create pull requests (Settings → Actions → General). A pull request opened
# with GITHUB_TOKEN starts no other workflow, so this job runs the script's own
# tests first; re-run `ci` from the pull request to check the Rust side.
on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: chore/update-prices
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin LiteLLM's latest commit
        run: |
          sha=$(gh api repos/BerriAI/litellm/commits/main --jq .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "unexpected commit id"; exit 1; }
          echo "LITELLM_SHA=$sha" >> "$GITHUB_ENV"
      - name: Rewrite the generated prices
        run: python3 -I scripts/update_prices.py --revision "$LITELLM_SHA" --summary "$RUNNER_TEMP/summary.md"
      - name: Anything changed?
        id: diff
        run: |
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- src/prices.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: The script's tests
        if: steps.diff.outputs.changed == 'true'
        run: python3 -I -m unittest discover -s scripts/tests
      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The branch is the bot's, rebuilt from main each run, but a
          # reviewer's commit on it (an entry moved into the hand part, say)
          # is never overwritten: stop instead.
          if git fetch --quiet origin "$BRANCH" 2>/dev/null; then
            last=$(git log -1 --format=%ae FETCH_HEAD)
            if [ "$last" != "$(git config user.email)" ]; then
              echo "::warning::$BRANCH has a commit by someone else; merge or close its pull request first"
              exit 0
            fi
          fi
          git switch -c "$BRANCH"
          git commit -m "chore(prices): update the generated prices from LiteLLM ${LITELLM_SHA:0:12} (#343)" -- src/prices.toml
          git push --force origin "$BRANCH"
          {
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Generated by \`scripts/update_prices.py\` from"
            echo "[LiteLLM \`${LITELLM_SHA:0:12}\`](https://github.com/BerriAI/litellm/blob/$LITELLM_SHA/model_prices_and_context_window.json)."
            echo "Check changed rates against the model providers' pricing pages before merging, and re-run \`ci\` here: this pull request started none."
          } > "$RUNNER_TEMP/body.md"
          if [ "$(wc -c < "$RUNNER_TEMP/body.md")" -gt 60000 ]; then # GitHub caps a body at 64K
            head -c 60000 "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/short.md"
            printf '\n\n… cut: the whole summary is on the workflow run.\n' >> "$RUNNER_TEMP/short.md"
            mv "$RUNNER_TEMP/short.md" "$RUNNER_TEMP/body.md"
          fi
          title="chore(prices): update the generated prices from LiteLLM"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
