name: enclos
label: enclos app
kind: platform
version: 0.0.1
description: >
  Prototype only (enclos prototype/m4). A channel for the enclos mobile app:
  listens on a Unix socket in the sandbox home, where enclos's bridge on the
  host connects. One JSON object per line each way.
author: enclos prototype
requires_env:
  - name: ENCLOS_SOCKET
    description: "Path of the Unix socket to listen on, in the sandbox home"
    prompt: "Socket path"
    password: false
optional_env:
  - name: ENCLOS_HOME_CHANNEL
    description: "Conversation that cron jobs with no origin deliver to"
    prompt: "Home conversation id (or empty)"
    password: false
  - name: ENCLOS_ALLOW_ALL_USERS
    description: "Prototype only: accept every person the bridge names"
    prompt: "Allow all? (true/false)"
    password: false
