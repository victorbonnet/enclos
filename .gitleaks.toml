# gitleaks reads this file from the folder it scans: the repository root
# for the CI `secrets` job and for a local `gitleaks git` run there. It keeps
# every default rule and adds one for personal data: a home folder path
# names its owner, and test output or a pasted log can carry the
# developer's. `tests/gitleaks_rule.sh` checks what the rule catches.

[extend]
useDefault = true

[[rules]]
id = "home-folder-path"
description = "An absolute home folder path, which names a person: write /Users/alice, /home/alice or ~ instead"
# A path that starts at the root, in a `file://` URL, or under macOS's
# /System/Volumes/Data; not `sandboxes/home/...`. Missed: a path glued to a
# short option, as in `-o/Users/...`. The user name is what the allowlist
# below is checked against.
regex = '''(?:^|[^A-Za-z0-9._~/-]|file://|/System/Volumes/Data)/(?:Users|home)/([A-Za-z0-9][A-Za-z0-9._-]*)'''
secretGroup = 1
# Lowercase on purpose: gitleaks lowercases the text before it looks for
# keywords.
keywords = ["/users/", "/home/"]

[[rules.allowlists]]
description = "Placeholder names in tests and docs, and folders that belong to no person"
regexes = [
  # Placeholders. `x` is in an older version of docs/design.md, allowed so
  # a scan of the whole history passes.
  '''^(?:alice|alicex|x)$''',
  # macOS's shared folder, and the GitHub Actions runner's user.
  '''^(?:Shared|runner)$''',
]
