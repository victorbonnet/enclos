<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 664" width="1040" height="664" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' role="img" aria-labelledby="t">
<title id="t">Everything in a sandbox runs under one compiled policy; only its proxy connects out</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="head-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="head-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker></defs>
<rect width="1040" height="664" rx="12" fill="#ffffff"/>
<text x="24" y="36" font-size="19" font-weight="600" fill="#1f2328" text-anchor="start">Everything in a sandbox runs under one compiled policy; only its proxy connects out</text>
<text x="24" y="62" font-size="14.5" font-weight="normal" fill="#59636e" text-anchor="start">On macOS, with Seatbelt. Green is allowed and red is refused, by the sandbox's policy.</text>
<rect x="24" y="82" width="714" height="558" rx="11" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="44" y="106" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Your Mac</text>
<text x="896" y="106" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">The network</text>
<rect x="44" y="116" width="340" height="504" rx="11" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="214" y="146" font-size="18" font-weight="600" fill="#1f2328" text-anchor="middle">Sandbox lab</text>
<text x="214" y="168" font-size="14.5" font-weight="normal" fill="#59636e" text-anchor="middle">Seatbelt applies its compiled policy</text>
<rect x="60" y="188" width="308" height="140" rx="9" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="214.0" y="243.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Hermes and its agents</text>
<text x="214.0" y="264.0" font-size="14.5" font-weight="normal" fill="#59636e" text-anchor="middle">the gateway, each session,</text>
<text x="214.0" y="283.0" font-size="14.5" font-weight="normal" fill="#59636e" text-anchor="middle">and every process they start</text>
<rect x="60" y="342" width="308" height="130" rx="9" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="214.0" y="392.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Its home</text>
<text x="214.0" y="413.0" font-size="14.5" font-weight="normal" fill="#59636e" text-anchor="middle">read and write: the runtime,</text>
<text x="214.0" y="432.0" font-size="14.5" font-weight="normal" fill="#59636e" text-anchor="middle">agents, login, caches</text>
<rect x="60" y="486" width="308" height="120" rx="9" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="214.0" y="540.5" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Workspaces you grant</text>
<text x="214.0" y="561.5" font-size="14.5" font-weight="normal" fill="#59636e" text-anchor="middle">read and write</text>
<polyline points="384,153 449,153" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#head-ok)"/>
<text x="416" y="144" font-size="13.5" font-weight="normal" fill="#59636e" text-anchor="middle">read</text>
<rect x="450" y="116" width="270" height="74" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
<text x="585.0" y="147.5" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">The rest of your disk</text>
<text x="585.0" y="168.5" font-size="14.5" font-weight="normal" fill="#1f2328" text-anchor="middle">read only</text>
<polyline points="384,239 449,239" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#head-no)"/>
<text x="416" y="230" font-size="13.5" font-weight="normal" fill="#59636e" text-anchor="middle">read</text>
<text x="416" y="245" font-size="19" font-weight="600" fill="#cf222e" text-anchor="middle">×</text>
<rect x="450" y="202" width="270" height="74" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
<text x="585.0" y="224.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">The deny list</text>
<text x="585.0" y="245.0" font-size="14.5" font-weight="normal" fill="#1f2328" text-anchor="middle">~/.ssh, keychains, browser data,</text>
<text x="585.0" y="264.0" font-size="14.5" font-weight="normal" fill="#1f2328" text-anchor="middle">other sandboxes, enclos's files</text>
<polyline points="384,325 449,325" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#head-no)"/>
<text x="416" y="316" font-size="13.5" font-weight="normal" fill="#59636e" text-anchor="middle">reach</text>
<text x="416" y="331" font-size="19" font-weight="600" fill="#cf222e" text-anchor="middle">×</text>
<rect x="450" y="288" width="270" height="74" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
<text x="585.0" y="310.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Host services</text>
<text x="585.0" y="331.0" font-size="14.5" font-weight="normal" fill="#1f2328" text-anchor="middle">Apple Events, launchd, preferences,</text>
<text x="585.0" y="350.0" font-size="14.5" font-weight="normal" fill="#1f2328" text-anchor="middle">pasteboard, other processes</text>
<polyline points="384,411 449,411" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#head-ok)"/>
<text x="416" y="402" font-size="13.5" font-weight="normal" fill="#59636e" text-anchor="middle">connect</text>
<rect x="450" y="374" width="270" height="74" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
<text x="585.0" y="396.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Egress proxy</text>
<text x="585.0" y="417.0" font-size="14.5" font-weight="normal" fill="#1f2328" text-anchor="middle">on the host, outside the sandbox;</text>
<text x="585.0" y="436.0" font-size="14.5" font-weight="normal" fill="#1f2328" text-anchor="middle">logs every connection it decides on</text>
<polyline points="384,497 449,497" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#head-no)"/>
<text x="416" y="488" font-size="13.5" font-weight="normal" fill="#59636e" text-anchor="middle">connect</text>
<text x="416" y="503" font-size="19" font-weight="600" fill="#cf222e" text-anchor="middle">×</text>
<rect x="450" y="460" width="270" height="74" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
<text x="585.0" y="482.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Anywhere else</text>
<text x="585.0" y="503.0" font-size="14.5" font-weight="normal" fill="#1f2328" text-anchor="middle">no direct connection, even to</text>
<text x="585.0" y="522.0" font-size="14.5" font-weight="normal" fill="#1f2328" text-anchor="middle">a host the proxy would allow</text>
<polyline points="449,583 384,583" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#head-ok)"/>
<text x="416" y="574" font-size="13.5" font-weight="normal" fill="#59636e" text-anchor="middle">accept</text>
<rect x="450" y="546" width="270" height="74" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
<text x="585.0" y="568.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Peers of its gateway</text>
<text x="585.0" y="589.0" font-size="14.5" font-weight="normal" fill="#1f2328" text-anchor="middle">your Mac and its network, answered</text>
<text x="585.0" y="608.0" font-size="14.5" font-weight="normal" fill="#1f2328" text-anchor="middle">without the proxy or network log</text>
<polyline points="720,399 775,399" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#head-ok)"/>
<polyline points="720,423 756,423 756,497 775,497" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#head-no)"/>
<text x="756" y="461.0" font-size="19" font-weight="600" fill="#cf222e" text-anchor="middle">×</text>
<rect x="776" y="374" width="240" height="74" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
<text x="896.0" y="396.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Allowed</text>
<text x="896.0" y="417.0" font-size="14.5" font-weight="normal" fill="#1f2328" text-anchor="middle">the public web, or</text>
<text x="896.0" y="436.0" font-size="14.5" font-weight="normal" fill="#1f2328" text-anchor="middle">only your allowlist</text>
<rect x="776" y="460" width="240" height="74" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
<text x="896.0" y="482.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Refused</text>
<text x="896.0" y="503.0" font-size="14.5" font-weight="normal" fill="#1f2328" text-anchor="middle">the host itself, cloud metadata,</text>
<text x="896.0" y="522.0" font-size="14.5" font-weight="normal" fill="#1f2328" text-anchor="middle">private hosts not opted in</text>
</svg>
