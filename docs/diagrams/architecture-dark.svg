<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 640" width="1140" height="640" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' role="img" aria-labelledby="t">
<title id="t">Every client goes through one core; each sandbox runs as its own services</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker></defs>
<rect width="1140" height="640" rx="12" fill="#0d1117"/>
<text x="40" y="38" font-size="18" font-weight="600" fill="#e6edf3" text-anchor="start">Every client goes through one core; each sandbox runs as its own services</text>
<text x="40" y="62" font-size="13.5" font-weight="normal" fill="#9198a1" text-anchor="start">No daemon: the CLI writes state and audit, and launchd keeps each sandbox's proxy and gateway running</text>
<rect x="40" y="84" width="300" height="80" rx="9" fill="#121d2f" stroke="#4493f8" stroke-width="2.5"/>
<text x="190.0" y="110.0" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">enclos (CLI)</text>
<text x="190.0" y="130.0" font-size="13.5" font-weight="normal" fill="#9198a1" text-anchor="middle">every operation</text>
<text x="190.0" y="148.0" font-size="13.5" font-weight="normal" fill="#9198a1" text-anchor="middle">milestone 1</text>
<line x1="190" y1="164" x2="190" y2="190" stroke="#9198a1" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="420" y="84" width="300" height="80" rx="9" fill="#0d1117" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="570.0" y="110.0" font-size="16" font-weight="600" fill="#6e7681" text-anchor="middle">enclos ui</text>
<text x="570.0" y="130.0" font-size="13.5" font-weight="normal" fill="#6e7681" text-anchor="middle">local web UI</text>
<text x="570.0" y="148.0" font-size="13.5" font-weight="normal" fill="#6e7681" text-anchor="middle">same audit log; later</text>
<line x1="570" y1="164" x2="570" y2="190" stroke="#9198a1" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="800" y="84" width="300" height="80" rx="9" fill="#0d1117" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="950.0" y="110.0" font-size="16" font-weight="600" fill="#6e7681" text-anchor="middle">enclos mcp</text>
<text x="950.0" y="130.0" font-size="13.5" font-weight="normal" fill="#6e7681" text-anchor="middle">for scripts and operator agents</text>
<text x="950.0" y="148.0" font-size="13.5" font-weight="normal" fill="#6e7681" text-anchor="middle">later</text>
<line x1="950" y1="164" x2="950" y2="190" stroke="#9198a1" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="40" y="192" width="1060" height="124" rx="11" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="60" y="216" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Core library</text>
<rect x="60" y="228" width="234" height="68" rx="9" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="177.0" y="257.0" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">State + audit</text>
<text x="177.0" y="277.0" font-size="13.5" font-weight="normal" fill="#9198a1" text-anchor="middle">SQLite + JSONL</text>
<rect x="322" y="228" width="234" height="68" rx="9" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="439.0" y="257.0" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">Policy</text>
<text x="439.0" y="277.0" font-size="13.5" font-weight="normal" fill="#9198a1" text-anchor="middle">layers, snapshots, compiled</text>
<rect x="584" y="228" width="234" height="68" rx="9" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="701.0" y="257.0" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">Runtime adapters</text>
<text x="701.0" y="277.0" font-size="13.5" font-weight="normal" fill="#9198a1" text-anchor="middle">install, login, agents</text>
<rect x="846" y="228" width="234" height="68" rx="9" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="963.0" y="257.0" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">Backend API</text>
<text x="963.0" y="277.0" font-size="13.5" font-weight="normal" fill="#9198a1" text-anchor="middle">one implementation each</text>
<polyline points="570,316 570,340" fill="none" stroke="#9198a1" stroke-width="1.5"/>
<line x1="177" y1="340" x2="963" y2="340" stroke="#9198a1" stroke-width="1.5"/>
<line x1="177" y1="340" x2="177" y2="358" stroke="#9198a1" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="60" y="360" width="234" height="64" rx="9" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="177.0" y="387.0" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">Seatbelt</text>
<text x="177.0" y="407.0" font-size="13.5" font-weight="normal" fill="#9198a1" text-anchor="middle">macOS, milestone 1</text>
<line x1="439" y1="340" x2="439" y2="358" stroke="#9198a1" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="322" y="360" width="234" height="64" rx="9" fill="#0d1117" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="439.0" y="387.0" font-size="16" font-weight="600" fill="#6e7681" text-anchor="middle">bubblewrap</text>
<text x="439.0" y="407.0" font-size="13.5" font-weight="normal" fill="#6e7681" text-anchor="middle">Linux, later</text>
<line x1="701" y1="340" x2="701" y2="358" stroke="#9198a1" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="584" y="360" width="234" height="64" rx="9" fill="#0d1117" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="701.0" y="387.0" font-size="16" font-weight="600" fill="#6e7681" text-anchor="middle">OpenShell</text>
<text x="701.0" y="407.0" font-size="13.5" font-weight="normal" fill="#6e7681" text-anchor="middle">later</text>
<line x1="963" y1="340" x2="963" y2="358" stroke="#9198a1" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="846" y="360" width="234" height="64" rx="9" fill="#0d1117" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="963.0" y="387.0" font-size="16" font-weight="600" fill="#6e7681" text-anchor="middle">MicroVM</text>
<text x="963.0" y="407.0" font-size="13.5" font-weight="normal" fill="#6e7681" text-anchor="middle">later: libkrun</text>
<text x="195" y="455" font-size="13.5" font-weight="normal" fill="#9198a1" text-anchor="start">runs the runtime inside the sandbox</text>
<rect x="40" y="476" width="1060" height="140" rx="11" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="1080" y="500" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="end">Services: launchd on macOS (systemd on Linux, later)</text>
<rect x="60" y="520" width="300" height="76" rx="9" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="210.0" y="544.0" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">Sandbox lab</text>
<text x="210.0" y="564.0" font-size="13.5" font-weight="normal" fill="#9198a1" text-anchor="middle">Hermes and its agents</text>
<text x="210.0" y="582.0" font-size="13.5" font-weight="normal" fill="#9198a1" text-anchor="middle">its own home and policy</text>
<rect x="420" y="520" width="300" height="76" rx="9" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="570.0" y="544.0" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">Egress proxy</text>
<text x="570.0" y="564.0" font-size="13.5" font-weight="normal" fill="#9198a1" text-anchor="middle">one per sandbox, on the host</text>
<text x="570.0" y="582.0" font-size="13.5" font-weight="normal" fill="#9198a1" text-anchor="middle">logs every connection</text>
<line x1="360" y1="558" x2="418" y2="558" stroke="#9198a1" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="780" y="520" width="300" height="76" rx="9" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="930.0" y="544.0" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">Allowed domains</text>
<text x="930.0" y="564.0" font-size="13.5" font-weight="normal" fill="#9198a1" text-anchor="middle">at validated addresses</text>
<text x="930.0" y="582.0" font-size="13.5" font-weight="normal" fill="#9198a1" text-anchor="middle">everything else refused</text>
<line x1="720" y1="558" x2="778" y2="558" stroke="#9198a1" stroke-width="1.5" marker-end="url(#head)"/>
<line x1="177" y1="424" x2="177" y2="518" stroke="#9198a1" stroke-width="1.5" marker-end="url(#head)"/>
</svg>
