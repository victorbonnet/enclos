# Assistants working on outside data through remote MCP servers (design
# §7): the sandbox writes only to its own home and reaches only what is
# listed, through the sandbox's proxy, which logs every connection. Once a
# runtime is installed, that is its adapter's endpoints (for Hermes: its
# install sources and the ChatGPT-subscription provider). List each MCP
# endpoint's host with `enclos policy allow`, such as `enclos policy allow
# community mcp.example.org`: nothing beyond the adapter's endpoints and
# what you allow is reachable.

[filesystem]
write = ["{home}"]

[network]
mode = "allowlist"
allow = []
