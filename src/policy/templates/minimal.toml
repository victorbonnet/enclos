# A starting point (design §7): the sandbox writes only to its own home and
# reaches only what is listed, through the sandbox's proxy, which logs every
# connection. Once a runtime is installed, that is its adapter's endpoints
# (for Hermes: its install sources and the ChatGPT-subscription provider);
# add another provider's hosts, or any destination, with `enclos policy
# allow`.

[filesystem]
write = ["{home}"]

[network]
mode = "allowlist"
allow = []
