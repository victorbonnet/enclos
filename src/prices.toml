# enclos's price list (issue #343, design §11, Usage): what a model's tokens
# cost, in US dollars per million tokens, from which enclos estimates the
# cost of an agent's usage. It ships inside enclos; enclos fetches no price
# when it runs. A file of the same format, `prices.toml` in enclos's config
# folder, overrides it: its entries win, per model provider and model.
#
# A model's rates: `input` (input not read from or written to the
# provider's cache, as enclos counts input), `output` (reasoning included),
# and, where the model provider prices them apart, `cache_read` and
# `cache_write`; a cache rate left out is priced as input. A model missing
# here has an unknown cost, never $0.
#
# `[model_providers.<name>]` names each model provider as runtimes call
# it, with `aliases` for its other names. One with `included = true` is a
# subscription: its tokens count against the subscription's limits, not
# in dollars, so their cost is "included". They are still priced at their
# model's list price, as if paid, to show how heavy an agent is: under the
# model provider its `priced_as` names, else under any that has the model.
#
# Entries above the generated block are kept by hand and win over generated
# ones. The block is rewritten by scripts/update_prices.py from a pinned
# LiteLLM commit, through a reviewed pull request; each of its entries
# names that commit as its `source`.

[model_providers.anthropic]
source = "https://platform.claude.com/docs/en/about-claude/pricing"

[model_providers.openai]
aliases = ["openai-api"]
source = "https://developers.openai.com/api/docs/pricing"

[model_providers.gemini]
aliases = ["google", "google-gemini", "google-ai-studio", "google-vertex", "vertex", "vertex-ai"]
source = "https://ai.google.dev/gemini-api/docs/pricing"

[model_providers.xai]
aliases = ["x-ai", "grok"]
source = "https://docs.x.ai/docs/models"

[model_providers.deepseek]
source = "https://api-docs.deepseek.com/quick_start/pricing"

[model_providers.mistral]
aliases = ["mistralai"]
source = "https://mistral.ai/pricing"

# A ChatGPT subscription, through Hermes's `openai-codex` login: OpenAI's
# models, at OpenAI's list prices.
[model_providers.openai-codex]
included = true
priced_as = "openai"

# A GitHub Copilot subscription.
[model_providers.copilot]
aliases = ["github-copilot", "github_copilot"]
included = true

