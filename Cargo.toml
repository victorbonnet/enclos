[package]
name = "enclos"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Create sandboxes, install agent runtimes in them and run agents there, with policy and an audit log"
license = "MIT"
repository = "https://github.com/victorbonnet/enclos"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
icu_properties = "2.3.0"
jiff = { version = "0.2.38", features = ["serde"] }
psl = "2.1.242"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["fs", "process", "pty", "stdio", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
signal-hook = "0.4.5"
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"
whoami = { version = "2.1.3", default-features = false, features = ["std"] }
zeroize = "1.9.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dev-dependencies]
tempfile = "3.27.0"
